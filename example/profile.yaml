# Example profile: a senior backend / data engineer. Edit to match your own background.
target_titles:
  - backend engineer
  - software engineer
  - data engineer
  - platform engineer
  - senior software engineer
avoid_titles: [intern, new grad, principal, director, manager, android, ios, mobile, frontend, sales, recruiter]
years_experience: 5
locations: [new york, nyc, remote, united states, usa]
remote_ok: true
