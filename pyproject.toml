[project]
name = "jobradar"
version = "1.0.0"
description = "Ranks open roles from public Greenhouse, Lever and Ashby job boards by explainable fit, and tailors resumes from verified facts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.8", "pyyaml>=6.0", "truststore>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
jobradar = "jobradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
"src/jobradar/report.py" = ["E501"]  # embedded HTML/CSS/JS template

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jobradar --cov-report=term-missing"
